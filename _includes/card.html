<a class="card" href="{{ include.post.url | relative_url }}">
  <span class="pill">{{ include.post.category }}</span>
  <h3>{{ include.post.title }}</h3>
  <p>{{ include.post.description }}</p>
  <div class="tags">{% for t in include.post.tags %}<span>{{ t }}</span>{% endfor %}<time>{{ include.post.date | date: "%d %b %Y" }}</time></div>
</a>
