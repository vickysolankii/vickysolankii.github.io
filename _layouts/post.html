---
layout: default
---
<article class="post">
  <span class="pill">{{ page.category }}</span>
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: "%d %b %Y" }} · {% assign w = content | number_of_words %}{{ w | divided_by: 200 | plus: 1 }} min read</div>
  <div class="tags">{% for t in page.tags %}<a href="{{ '/tags/' | relative_url }}#{{ t }}">{{ t }}</a>{% endfor %}</div>
  {{ content }}
</article>
